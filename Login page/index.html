<!Doctype html>
<html>
  <head>
    <title>Login page</title>
     <meta charset="UTF-8">

  <link rel="stylesheet" href="Style.css">
  <script src="Script.js"></script>
  </head>
  <body>
<div>
       <form>
       <h3>Login</h3>

      <p>Don't have an account? <a href="#">sign in</a></p>
      <button type="submit">Log in</button>
       </form>
       </div>
  </body>
</html>
